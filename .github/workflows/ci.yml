name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Only keep the latest run per ref; cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Windows, Python 3.13)
    # Windows runner matches the project's native target (the vendored GAS.dll is a
    # Windows PE binary committed under vendor/) and lets PySide6 + the offscreen Qt
    # plugin install without extra system packages.
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      # No display on CI: use Qt's offscreen platform plugin so the PySide6 widget
      # tests can create a QApplication headlessly.
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        # Runtime deps are PySide6 (GUI) and pyserial; pytest runs the suite. PySide6
        # is pinned to the version developed against; pyserial/pytest float.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.11.0" pyserial pytest

      - name: Run tests
        # pyproject.toml provides testpaths=tests and pythonpath=src. The suite uses
        # fake controllers, so no real motion card / serial hardware is needed.
        # Fresh Qt application/process per module; all modules run and any native
        # crash, assertion failure or timeout fails CI without an automatic retry.
        run: python scripts/run_regression.py
